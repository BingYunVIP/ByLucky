name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://bylucky:bylucky_dev@localhost:5431/bylucky
      ADMIN_USERNAME: ci
      ADMIN_PASSWORD_HASH: ci-placeholder
      SESSION_SECRET: ci-session-secret-012345678901234567890123
      CODE_HMAC_SECRET: ci-code-hmac-secret-012345678901234567890123
      CONFIG_ENCRYPTION_KEY: ci-config-encryption-key-012345678901234567890123
      LOG_LEVEL: error
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build Worker
        run: npm run worker:build

      - name: Build production app
        run: npm run build

name: bylucky-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bylucky
      POSTGRES_USER: bylucky
      POSTGRES_PASSWORD: bylucky_dev
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bylucky_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bylucky -d bylucky"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  bylucky_postgres_data:
